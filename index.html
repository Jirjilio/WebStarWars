<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars - SWAPI Explorer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <canvas class="starfield" id="starfield" aria-hidden="true"></canvas>

    <header class="header">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">★</span>
                <div class="logo-text">
                    <h1>SWAPI EXPLORER</h1>
                    <span class="logo-tagline">STAR WARS DATABASE</span>
                </div>
            </div>
        </div>

        <nav class="nav-tabs" role="tablist">
            <button class="nav-tab active" role="tab" data-tab="characters" aria-selected="true">Personatges</button>
            <button class="nav-tab" role="tab" data-tab="planets" aria-selected="false">Planetetes</button>
            <button class="nav-tab" role="tab" data-tab="starships" aria-selected="false">Naus</button>
        </nav>
    </header>

    <main class="main">
        <div class="search-container">
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="character-search" class="search-input" placeholder="Cerca per nom..." autocomplete="off">
                <button class="search-clear" id="search-clear" aria-label="Neteja cerca">✕</button>
            </div>
            <div class="search-results-count" id="search-results-count"></div>
        </div>
    </main>
